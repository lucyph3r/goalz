<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Goals">
<title>Biweekly Goals</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --coral: #FF385C;
  --coral-light: #FFE8EC;
  --coral-dark: #D90B30;
  --bg: #FFFFFF;
  --bg-soft: #F7F7F7;
  --bg-card: #FFFFFF;
  --border: #EBEBEB;
  --border-strong: #D1D1D1;
  --text: #222222;
  --text-sub: #717171;
  --text-hint: #AAAAAA;
  --green: #008A05;
  --green-light: #E6F5E6;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.07);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--bg-soft); color:var(--text); font-family:var(--font); min-height:100dvh; overflow-x:hidden; -webkit-font-smoothing:antialiased; }

.header { position:sticky; top:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--border); padding:0 20px; height:60px; display:flex; align-items:center; justify-content:space-between; }
.header-logo { display:flex; align-items:center; gap:8px; }
.logo-icon { width:32px; height:32px; background:var(--coral); border-radius:8px; display:flex; align-items:center; justify-content:center; color:white; font-size:18px; font-weight:800; flex-shrink:0; }
.logo-text { font-size:17px; font-weight:800; color:var(--text); letter-spacing:-0.3px; }
.header-btns { display:flex; gap:8px; align-items:center; }
.hbtn { width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; box-shadow:var(--shadow-sm); }
.hbtn:active { transform:scale(0.92); background:var(--bg-soft); }

.period-scroll-wrap { background:var(--bg); border-bottom:1px solid var(--border); padding:12px 0 12px 20px; overflow-x:auto; scrollbar-width:none; display:flex; gap:8px; align-items:center; }
.period-scroll-wrap::-webkit-scrollbar { display:none; }
.period-pill { flex-shrink:0; padding:8px 16px; border-radius:999px; border:1.5px solid var(--border); background:var(--bg); color:var(--text-sub); font-family:var(--font); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all 0.18s; }
.period-pill.active { background:var(--text); color:var(--bg); border-color:var(--text); }
.period-pill:active { transform:scale(0.95); }
.period-add-pill { flex-shrink:0; margin-right:20px; padding:8px 16px; border-radius:999px; border:1.5px dashed var(--border-strong); background:transparent; color:var(--text-sub); font-family:var(--font); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:5px; transition:all 0.18s; }
.period-add-pill:active { border-color:var(--coral); color:var(--coral); }

.tab-row { background:var(--bg); display:flex; border-bottom:1px solid var(--border); padding:0 20px; position:sticky; top:61px; z-index:90; }
.tab { flex:1; padding:14px 0 12px; text-align:center; font-size:13px; font-weight:600; color:var(--text-hint); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.18s; letter-spacing:-0.1px; }
.tab.active { color:var(--text); border-bottom-color:var(--text); }

.main { padding:20px 16px 100px; max-width:600px; margin:0 auto; }

.stats-strip { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px; }
.stat-tile { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 12px; text-align:center; box-shadow:var(--shadow-sm); }
.stat-num { font-size:26px; font-weight:800; color:var(--text); letter-spacing:-1px; line-height:1; }
.stat-num.green { color:var(--green); }
.stat-num.coral { color:var(--coral); }
.stat-lbl { font-size:11px; font-weight:600; color:var(--text-hint); margin-top:4px; text-transform:uppercase; letter-spacing:0.4px; }

.progress-section { margin-bottom:22px; }
.progress-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.progress-label { font-size:13px; font-weight:600; color:var(--text-sub); }
.progress-pct { font-size:13px; font-weight:700; color:var(--coral); }
.progress-track { height:6px; background:var(--border); border-radius:99px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--coral),#FF6B81); border-radius:99px; transition:width 0.5s cubic-bezier(0.4,0,0.2,1); }

.section-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.section-title { font-size:15px; font-weight:700; color:var(--text); letter-spacing:-0.2px; }
.section-sub { font-size:12px; color:var(--text-hint); font-weight:500; }

.goal-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow 0.2s,border-color 0.2s; }
.goal-card.done { border-color:#C8E6C9; background:#FAFFFE; }
.goal-card:active { box-shadow:none; }
.goal-body { padding:16px; display:flex; gap:12px; align-items:flex-start; }
.check-wrap { flex-shrink:0; margin-top:1px; }
.check-circle { width:24px; height:24px; border-radius:50%; border:2px solid var(--border-strong); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s cubic-bezier(0.4,0,0.2,1); }
.check-circle.checked { background:var(--green); border-color:var(--green); transform:scale(1.05); }
.check-circle svg { display:none; }
.check-circle.checked svg { display:block; }
.goal-content { flex:1; min-width:0; }
.goal-title { font-size:15px; font-weight:700; color:var(--text); line-height:1.35; letter-spacing:-0.2px; margin-bottom:3px; }
.goal-card.done .goal-title { text-decoration:line-through; color:var(--text-hint); }
.goal-desc { font-size:13px; color:var(--text-sub); line-height:1.5; font-weight:400; }
.goal-footer { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.att-pill { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:6px; background:var(--bg-soft); border:1px solid var(--border); font-size:11px; font-weight:600; color:var(--text-sub); }
.goal-btns { display:flex; gap:4px; align-items:center; }
.g-btn { width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--bg-soft); color:var(--text-sub); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.g-btn:active { background:var(--border); transform:scale(0.9); }
.g-btn.del:active { background:#FFE8EC; border-color:var(--coral); color:var(--coral); }

.att-panel { border-top:1px solid var(--border); background:var(--bg-soft); padding:14px 16px; display:none; }
.att-panel.open { display:block; animation:fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
.att-panel-title { font-size:11px; font-weight:700; color:var(--text-hint); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:10px; }
.att-list { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.att-row { display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; }
.att-ico { font-size:14px; flex-shrink:0; }
.att-txt { flex:1; font-size:12px; font-weight:500; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.att-lnk { color:#0066CC; text-decoration:none; }
.att-lnk:hover { text-decoration:underline; }
.att-remove { background:none; border:none; color:var(--text-hint); font-size:14px; cursor:pointer; padding:2px 4px; border-radius:4px; line-height:1; transition:color 0.15s; }
.att-remove:active { color:var(--coral); }
.add-att-form { display:flex; gap:6px; align-items:center; }
.att-type-toggle { display:flex; gap:4px; flex-shrink:0; }
.att-type-btn { width:32px; height:32px; border-radius:8px; border:1.5px solid var(--border); background:var(--bg); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.att-type-btn.sel { border-color:var(--coral); background:var(--coral-light); }
.att-type-btn:active { transform:scale(0.9); }
.att-field { flex:1; height:32px; border:1.5px solid var(--border); border-radius:8px; padding:0 10px; font-family:var(--font); font-size:12px; font-weight:500; color:var(--text); background:var(--bg); outline:none; transition:border-color 0.15s; }
.att-field:focus { border-color:var(--coral); }
.att-ok { height:32px; padding:0 12px; border-radius:8px; border:none; background:var(--coral); color:white; font-family:var(--font); font-size:13px; font-weight:700; cursor:pointer; transition:opacity 0.15s; white-space:nowrap; }
.att-ok:active { opacity:0.8; }

.empty { text-align:center; padding:56px 24px; }
.empty-icon { width:72px; height:72px; background:var(--coral-light); border-radius:50%; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; font-size:32px; }
.empty-title { font-size:18px; font-weight:800; color:var(--text); margin-bottom:8px; letter-spacing:-0.3px; }
.empty-sub { font-size:14px; color:var(--text-sub); line-height:1.6; font-weight:400; }

.fab { position:fixed; bottom:24px; right:20px; height:52px; padding:0 22px; border-radius:999px; border:none; background:var(--coral); color:white; font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:7px; box-shadow:0 4px 14px rgba(255,56,92,0.4),0 2px 4px rgba(255,56,92,0.2); z-index:50; transition:all 0.2s; letter-spacing:-0.2px; }
.fab:active { transform:scale(0.94); box-shadow:0 2px 6px rgba(255,56,92,0.3); }

.sheet-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; display:none; align-items:flex-end; }
.sheet-backdrop.open { display:flex; }
.sheet-backdrop.open .sheet { animation:sheetUp 0.28s cubic-bezier(0.32,0.72,0,1); }
@keyframes sheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
.sheet { width:100%; max-width:600px; margin:0 auto; background:var(--bg); border-radius:20px 20px 0 0; padding:0 20px 36px; max-height:88dvh; overflow-y:auto; }
.sheet-handle { width:36px; height:4px; background:var(--border); border-radius:99px; margin:12px auto 20px; }
.sheet-title { font-size:18px; font-weight:800; color:var(--text); margin-bottom:20px; letter-spacing:-0.4px; }
.form-group { margin-bottom:16px; }
.form-label { display:block; font-size:12px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:7px; }
.form-input,.form-textarea { width:100%; border:1.5px solid var(--border); border-radius:var(--radius); padding:12px 14px; font-family:var(--font); font-size:15px; font-weight:500; color:var(--text); background:var(--bg); outline:none; transition:border-color 0.18s,box-shadow 0.18s; -webkit-appearance:none; }
.form-input:focus,.form-textarea:focus { border-color:var(--coral); box-shadow:0 0 0 3px rgba(255,56,92,0.1); }
.form-textarea { resize:none; height:90px; line-height:1.5; }
.date-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn-row { display:flex; gap:10px; margin-top:22px; }
.btn-ghost { flex:1; height:50px; border-radius:var(--radius); border:1.5px solid var(--border); background:transparent; color:var(--text); font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer; transition:all 0.15s; }
.btn-ghost:active { background:var(--bg-soft); }
.btn-coral { flex:2; height:50px; border-radius:var(--radius); border:none; background:var(--coral); color:white; font-family:var(--font); font-size:15px; font-weight:800; cursor:pointer; letter-spacing:-0.2px; box-shadow:0 4px 14px rgba(255,56,92,0.3); transition:all 0.15s; }
.btn-coral:active { opacity:0.85; transform:scale(0.98); }

.import-preview { background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:16px; max-height:180px; overflow-y:auto; display:none; }
.preview-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--border); font-size:13px; color:var(--text-sub); font-weight:500; }
.preview-row:last-child { border-bottom:none; }
.preview-stat { font-size:14px; font-weight:700; color:var(--text); padding:6px 0 10px; border-bottom:1px solid var(--border); margin-bottom:6px; }

.hist-period { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-sm); }
.hist-period-header { padding:14px 16px 10px; border-bottom:1px solid var(--border); }
.hist-period-name { font-size:14px; font-weight:700; color:var(--text); margin-bottom:6px; }
.hist-progress-row { display:flex; align-items:center; gap:10px; }
.hist-track { flex:1; height:4px; background:var(--border); border-radius:99px; overflow:hidden; }
.hist-fill { height:100%; background:linear-gradient(90deg,var(--coral),#FF6B81); border-radius:99px; }
.hist-pct { font-size:12px; font-weight:700; color:var(--coral); white-space:nowrap; }
.hist-goals { padding:8px 16px 12px; }
.hist-goal-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; font-weight:500; }
.hist-goal-row:last-child { border-bottom:none; }
.hist-goal-row.done { color:var(--text-hint); text-decoration:line-through; }

.toast { position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--text); color:var(--bg); font-size:13px; font-weight:600; padding:10px 20px; border-radius:999px; z-index:999; opacity:0; transition:all 0.25s cubic-bezier(0.4,0,0.2,1); white-space:nowrap; pointer-events:none; letter-spacing:-0.1px; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
input[type="date"] { color-scheme:light; }
input[type="date"]::-webkit-calendar-picker-indicator { opacity:0.5; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <div class="logo-icon">🎯</div>
    <span class="logo-text">Goals</span>
  </div>
  <div class="header-btns">
    <button class="hbtn" id="notifBtn" title="Attiva reminder scadenza">🔕</button>
    <button class="hbtn" id="testNotifBtn" title="Testa notifica" style="font-size:11px;font-weight:700;letter-spacing:-0.3px">TEST</button>
    <button class="hbtn" id="importBtn" title="Importa CSV">⬆</button>
    <button class="hbtn" id="exportBtn" title="Esporta CSV">⬇</button>
    <input type="file" id="importFileInput" accept=".csv,text/csv" style="display:none">
  </div>
</div>

<div class="period-scroll-wrap" id="periodScroll"></div>

<div class="tab-row">
  <div class="tab active" data-tab="current">Attivi</div>
  <div class="tab" data-tab="history">Storico</div>
</div>

<div id="tab-current">
  <div class="main" id="mainContent"></div>
</div>

<div id="tab-history" style="display:none">
  <div class="main" id="historyContent"></div>
</div>

<button class="fab" id="addGoalBtn">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
  Obiettivo
</button>

<!-- Sheet Periodo -->
<div class="sheet-backdrop" id="sheetPeriod">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Nuovo periodo</div>
    <div class="date-grid">
      <div class="form-group">
        <label class="form-label">Inizio</label>
        <input type="date" class="form-input" id="periodStart">
      </div>
      <div class="form-group">
        <label class="form-label">Fine</label>
        <input type="date" class="form-input" id="periodEnd">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Etichetta (opzionale)</label>
      <input type="text" class="form-input" id="periodLabel" placeholder="es. Sprint W3-W4">
    </div>
    <div class="btn-row">
      <button class="btn-ghost" id="periodCancel">Annulla</button>
      <button class="btn-coral" id="periodSave">Crea periodo</button>
    </div>
  </div>
</div>

<!-- Sheet Goal -->
<div class="sheet-backdrop" id="sheetGoal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="goalSheetTitle">Nuovo obiettivo</div>
    <div class="form-group">
      <label class="form-label">Titolo *</label>
      <input type="text" class="form-input" id="goalTitle" placeholder="Cosa vuoi raggiungere?">
    </div>
    <div class="form-group">
      <label class="form-label">Descrizione</label>
      <textarea class="form-textarea" id="goalDesc" placeholder="Dettagli, metriche, criteri di successo..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn-ghost" id="goalCancel">Annulla</button>
      <button class="btn-coral" id="goalSave">Salva</button>
    </div>
  </div>
</div>

<!-- Sheet Import -->
<div class="sheet-backdrop" id="sheetImport">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Importa CSV</div>
    <p style="font-size:14px;color:var(--text-sub);line-height:1.6;margin-bottom:18px;font-weight:400;">
      Importa un file CSV esportato da questa app. I dati già presenti non verranno duplicati.
    </p>
    <div class="import-preview" id="importPreview"></div>
    <button class="btn-coral" id="importPickFile" style="width:100%;margin-bottom:12px;height:50px;border-radius:12px;flex:none;">
      📂 &nbsp;Scegli file CSV
    </button>
    <div class="btn-row">
      <button class="btn-ghost" id="importCancel">Annulla</button>
      <button class="btn-coral" id="importConfirm" style="display:none">Importa</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let state = { periods:[], goals:[], activePeriodId:null, currentTab:'current', editingGoalId:null };
function load() { const r=localStorage.getItem('bgapp_v3'); if(r){try{state={...state,...JSON.parse(r)};}catch(e){}} }
function save() { localStorage.setItem('bgapp_v3',JSON.stringify(state)); }
load();

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmtDate(d) { if(!d)return''; const[y,m,dd]=d.split('-'); return`${dd}/${m}`; }
function fmtDateFull(d) { if(!d)return''; const[y,m,dd]=d.split('-'); return`${dd}/${m}/${y}`; }
function todayStr() { return new Date().toISOString().slice(0,10); }
function addDays(d,n) { const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

function render() { renderPeriods(); renderGoals(); }

function renderPeriods() {
  const wrap=document.getElementById('periodScroll');
  wrap.innerHTML='';
  state.periods.sort((a,b)=>a.start.localeCompare(b.start)).forEach(p=>{
    const pill=document.createElement('div');
    pill.className='period-pill'+(p.id===state.activePeriodId?' active':'');
    pill.textContent=p.label||`${fmtDate(p.start)} - ${fmtDate(p.end)}`;
    pill.onclick=()=>{ state.activePeriodId=p.id; save(); render(); };
    wrap.appendChild(pill);
  });
  const addBtn=document.createElement('button');
  addBtn.className='period-add-pill';
  addBtn.innerHTML='<span style="font-size:16px;line-height:1">+</span> Periodo';
  addBtn.onclick=openPeriodSheet;
  wrap.appendChild(addBtn);
}

function renderGoals() {
  const main=document.getElementById('mainContent');
  main.innerHTML='';
  if(!state.activePeriodId) {
    document.getElementById('addGoalBtn').style.display='none';
    main.appendChild(buildEmptyPeriod()); return;
  }
  document.getElementById('addGoalBtn').style.display='flex';
  const period=state.periods.find(p=>p.id===state.activePeriodId);
  const goals=state.goals.filter(g=>g.periodId===state.activePeriodId);
  const done=goals.filter(g=>g.done).length, total=goals.length;
  const pct=total?Math.round((done/total)*100):0;
  if(total>0) {
    const stats=document.createElement('div');
    stats.className='stats-strip';
    stats.innerHTML=`<div class="stat-tile"><div class="stat-num">${total}</div><div class="stat-lbl">Totale</div></div><div class="stat-tile"><div class="stat-num green">${done}</div><div class="stat-lbl">Fatti</div></div><div class="stat-tile"><div class="stat-num coral">${pct}%</div><div class="stat-lbl">Score</div></div>`;
    main.appendChild(stats);
    const prog=document.createElement('div'); prog.className='progress-section';
    const plabel=period?(period.label||`${fmtDateFull(period.start)} - ${fmtDateFull(period.end)}`): '';
    prog.innerHTML=`<div class="progress-header"><span class="progress-label">${esc(plabel)}</span><span class="progress-pct">${pct}% completato</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    main.appendChild(prog);
  }
  if(goals.length===0) { main.appendChild(buildEmptyGoals()); return; }
  const shdr=document.createElement('div'); shdr.className='section-hdr';
  shdr.innerHTML=`<span class="section-title">Obiettivi</span><span class="section-sub">${done} di ${total} completati</span>`;

  goals.forEach(g=>{ const card=buildGoalCard(g); main.appendChild(card); });

}

function attachPanelEvents(goalId) {
  document.querySelectorAll(`[data-att-type="${goalId}"]`).forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll(`[data-att-type="${goalId}"]`).forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
    });
  });
  const addBtn=document.querySelector(`[data-att-add="${goalId}"]`);
  if(addBtn) {
    addBtn.addEventListener('click',()=>{
      const input=document.getElementById(`attinput-${goalId}`);
      const val=input.value.trim(); if(!val)return;
      const typeBtn=document.querySelector(`[data-att-type="${goalId}"].sel`);
      const type=typeBtn?typeBtn.dataset.type:'note';
      const g=state.goals.find(x=>x.id===goalId); if(!g)return;
      if(!g.attachments)g.attachments=[];
      const isLink=type==='link'||val.startsWith('http');
      g.attachments.push({type:isLink?'link':'note',label:val,value:val});
      input.value=''; save(); refreshAttPanel(goalId);
    });
  }
  document.querySelectorAll(`[data-att-del^="${goalId}-"]`).forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.attDel.split('-')[1]);
      const g=state.goals.find(x=>x.id===goalId);
      if(g&&g.attachments){g.attachments.splice(idx,1);save();refreshAttPanel(goalId);}
    });
  });
}

function refreshAttPanel(goalId) {
  const panel=document.getElementById(`attpanel-${goalId}`); if(!panel)return;
  const wasOpen=panel.classList.contains('open');
  const g=state.goals.find(x=>x.id===goalId); if(!g)return;
  panel.innerHTML=buildAttHTML(g);
  if(wasOpen)panel.classList.add('open');
  attachPanelEvents(goalId);
  const card=document.querySelector(`[data-goal-id="${goalId}"]`);
  if(card){
    const cnt=(g.attachments||[]).length;
    const footer=card.querySelector('.goal-footer');
    if(footer){
      const badge=footer.querySelector('.att-pill');
      if(cnt>0){
        const txt=`📎 ${cnt} allegat${cnt===1?'o':'i'}`;
        if(badge)badge.textContent=txt;
        else{const s=document.createElement('span');s.className='att-pill';s.textContent=txt;footer.insertBefore(s,footer.firstChild);}
      } else if(badge){badge.replaceWith(document.createElement('span'));}
    }
  }
}

function parseCSVLine(line) {
  const result=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else{cur+=c;}
  }
  result.push(cur); return result;
}

function parseCSVImport(text) {
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){showToast('File CSV non valido');return;}
  const rows=lines.map(parseCSVLine);
  const header=rows[0].map(h=>h.toLowerCase().trim());
  const iLabel=header.indexOf('periodo'),iStart=header.indexOf('inizio'),iEnd=header.indexOf('fine');
  const iTitle=header.indexOf('titolo'),iDesc=header.indexOf('descrizione');
  const iDone=header.indexOf('completato'),iAtt=header.indexOf('allegati');
  if(iTitle===-1||iStart===-1){showToast('Intestazioni CSV non riconosciute');return;}
  const newPeriods=[],newGoals=[],periodMap={};
  state.periods.forEach(p=>{periodMap[p.start+'_'+p.end]=p.id;});
  rows.slice(1).forEach(row=>{
    const start=row[iStart]||'',end=row[iEnd]||'',label=iLabel!==-1?row[iLabel]:'';
    const title=row[iTitle]||'',desc=iDesc!==-1?row[iDesc]:'';
    const done=iDone!==-1?(row[iDone].toLowerCase()==='sì'||row[iDone].toLowerCase()==='si'||row[iDone]==='1'):false;
    const attRaw=iAtt!==-1?row[iAtt]:'';
    if(!title||!start)return;
    const key=start+'_'+end;
    if(!periodMap[key]){const pid=uid();periodMap[key]=pid;newPeriods.push({id:pid,start,end,label});}
    const periodId=periodMap[key];
    if(state.goals.some(g=>g.periodId===periodId&&g.title===title))return;
    const attachments=[];
    if(attRaw){attRaw.split('|').forEach(a=>{const tr=a.trim();if(!tr)return;const ci=tr.indexOf(':');if(ci>0){const type=tr.slice(0,ci).trim(),value=tr.slice(ci+1).trim();attachments.push({type,label:value,value});}else{attachments.push({type:'note',label:tr,value:tr});}});}
    newGoals.push({id:uid(),periodId,title,desc,done,attachments});
  });
  if(!newPeriods.length&&!newGoals.length){showToast('Nessun dato nuovo da importare');return;}
  pendingImport={newPeriods,newGoals};
  const prev=document.getElementById('importPreview');
  prev.style.display='block';
  let html=`<div class="preview-stat">+${newPeriods.length} period${newPeriods.length===1?'o':'i'} &nbsp;·&nbsp; +${newGoals.length} obiettiv${newGoals.length===1?'o':'i'}</div>`;
  newGoals.slice(0,7).forEach(g=>{
    const p=newPeriods.find(x=>x.id===g.periodId)||state.periods.find(x=>x.id===g.periodId);
    const pl=p?(p.label||fmtDateFull(p.start)):'';
    html+=`<div class="preview-row"><span>${g.done?'✅':'⬜'}</span><span style="flex:1;color:var(--text)">${esc(g.title)}</span><span style="font-size:11px;color:var(--text-hint)">${esc(pl)}</span></div>`;
  });
  if(newGoals.length>7)html+=`<div style="font-size:12px;color:var(--text-hint);padding:6px 0">... e altri ${newGoals.length-7}</div>`;
  prev.innerHTML=html;
  document.getElementById('importConfirm').style.display='block';
}

// ── NOTIFICATIONS ─────────────────────────────────────────────────────
// Store for scheduled notification timeouts (key: periodId)
const notifTimers = {};

async function requestNotifPermission() {
  if(!('Notification' in window)) return false;
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied') return false;
  const result = await Notification.requestPermission();
  return result === 'granted';
}

function scheduleExpiryNotification(period) {
  if(!period) return;
  // Cancel any existing timer for this period
  if(notifTimers[period.id]) { clearTimeout(notifTimers[period.id]); delete notifTimers[period.id]; }

  const today = todayStr();
  if(period.end < today) return; // already expired

  // Fire at 09:00 on the last day of the period
  const fireAt = new Date(period.end + 'T09:00:00');
  const now = new Date();
  const msUntil = fireAt - now;
  if(msUntil <= 0) {
    // Already past 09:00 on end day — fire a reminder now if still today
    if(period.end === today) fireExpiryNotif(period);
    return;
  }

  notifTimers[period.id] = setTimeout(() => fireExpiryNotif(period), msUntil);
}

function fireExpiryNotif(period) {
  if(Notification.permission !== 'granted') return;
  const label = period.label || `${fmtDateFull(period.start)} - ${fmtDateFull(period.end)}`;
  const goals = state.goals.filter(g => g.periodId === period.id);
  const done = goals.filter(g => g.done).length;
  const total = goals.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  new Notification('⏰ Periodo in scadenza oggi!', {
    body: `"${label}" · ${done}/${total} obiettivi completati (${pct}%)`,
    icon: 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 192 192\'%3E%3Crect width=\'192\' height=\'192\' rx=\'40\' fill=\'%23FF385C\'/%3E%3Ccircle cx=\'96\' cy=\'96\' r=\'52\' stroke=\'white\' stroke-width=\'10\' fill=\'none\'/%3E%3Ccircle cx=\'96\' cy=\'96\' r=\'22\' fill=\'white\'/%3E%3C/svg%3E',
    badge: 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 96 96\'%3E%3Crect width=\'96\' height=\'96\' rx=\'20\' fill=\'%23FF385C\'/%3E%3C/svg%3E',
    tag: 'period-expiry-' + period.id,
    requireInteraction: true
  });
}

async function enableNotifications() {
  const granted = await requestNotifPermission();
  if(!granted) { showToast('Notifiche non autorizzate'); return; }
  // Schedule for current active period
  const today = todayStr();
  const current = state.periods.find(p => p.start <= today && p.end >= today);
  if(current) {
    scheduleExpiryNotification(current);
    showToast('Reminder attivato per la scadenza del periodo ✓');
  } else {
    showToast('Nessun periodo attivo da monitorare');
  }
  updateNotifBtn();
}

function updateNotifBtn() {
  const btn = document.getElementById('notifBtn');
  if(!btn) return;
  const granted = 'Notification' in window && Notification.permission === 'granted';
  btn.title = granted ? 'Notifiche attive' : 'Attiva reminder scadenza';
  btn.style.background = granted ? '#FFE8EC' : '';
  btn.style.borderColor = granted ? 'var(--coral)' : '';
  btn.style.color = granted ? 'var(--coral)' : '';
  btn.textContent = granted ? '🔔' : '🔕';
}

// Auto-reschedule on load if permission already granted
window.addEventListener('load', () => {
  updateNotifBtn();
  if('Notification' in window && Notification.permission === 'granted') {
    const today = todayStr();
    const current = state.periods.find(p => p.start <= today && p.end >= today);
    if(current) scheduleExpiryNotification(current);
  }
});

// Also reschedule whenever a new period becomes active
const _origSave = save;
// Hook into period changes: reschedule after render when active period changes
function rescheduleIfNeeded() {
  if('Notification' in window && Notification.permission === 'granted') {
    const today = todayStr();
    const current = state.periods.find(p => p.start <= today && p.end >= today);
    if(current) scheduleExpiryNotification(current);
  }
}

render();
state.goals.filter(g=>g.periodId===state.activePeriodId).forEach(g=>attachPanelEvents(g.id));
rescheduleIfNeeded();
</script>
